version: 2
updates:
  # Suite packages: one grouped weekly pull request for every @hivemagnus/* update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "@hivemagnus/*"
    ignore:
      # Built from this repository and resolved as workspace links; versions move with the release bump.
      - dependency-name: "@hivemagnus/emberfold*"
    groups:
      hivemagnus:
        patterns:
          - "@hivemagnus/*"

  # Suite packages: one grouped weekly pull request for every @hivemagnus/* update.
  - package-ecosystem: npm
    directory: /integrations/emberfold-hermes
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "@hivemagnus/*"
    groups:
      hivemagnus:
        patterns:
          - "@hivemagnus/*"
